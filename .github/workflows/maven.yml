name: WeChat weather and poem

on:
  workflow_dispatch:
    inputs:
      send_message:
        description: '确认配置无误后勾选：实际向已配置收件人发送消息'
        required: true
        type: boolean
        default: false
  # 配置并手动测试成功后，取消下面两行注释：北京时间每天08:08。
  # schedule:
  #   - cron: '8 0 * * *'

permissions:
  contents: read

concurrency:
  group: wechat-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build and run offline tests
        run: mvn -B -Dfile.encoding=UTF-8 package
      - name: Validate configuration without network access
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: java -jar target/VxMessageActions-1.0-SNAPSHOT.jar --check-config
      - name: Send configured messages once
        if: github.event_name == 'schedule' || inputs.send_message == true
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: java -jar target/VxMessageActions-1.0-SNAPSHOT.jar